version: '3.8'

services:
  # FastAPI Multi-Agent Backend
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: recruiting_copilot_backend
    ports:
      - "8000:8000"
    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - QDRANT_HOST=qdrant
      - QDRANT_PORT=6333
      - DATABASE_URL=postgresql://recruiter:recruiter_secret@postgres:5432/recruiting_db
    depends_on:
      - qdrant
      - postgres
    restart: unless-stopped

  # Qdrant Vector Database
  qdrant:
    image: qdrant/qdrant:v1.8.2
    container_name: recruiting_copilot_qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_storage:/qdrant/storage
    restart: unless-stopped

  # PostgreSQL Relational Database
  postgres:
    image: postgres:15-alpine
    container_name: recruiting_copilot_postgres
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=recruiter
      - POSTGRES_PASSWORD=recruiter_secret
      - POSTGRES_DB=recruiting_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

  # Next.js Recruiter Dashboard
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: recruiting_copilot_frontend
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  qdrant_storage:
  postgres_data:
